name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs-skeleton:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Pages skeleton files
        run: |
          set -euo pipefail
          required=(
            site/index.html
            site/getting-started.html
            site/limits.html
            site/ethics.html
            site/privacy.html
            site/methodology.html
            site/scoring-bands.html
            site/architecture.html
            site/api-overview.html
            site/api-quotas.html
            site/supported-sites.html
            site/self-host.html
            site/glossary.html
            site/styles.css
            .github/workflows/pages.yml
            scripts/scan-secrets.mjs
            scripts/build-wiki-pages.mjs
          )
          for f in "${required[@]}"; do
            test -f "$f"
            echo "PASS exists: $f"
          done
          grep -q 'public-API-only' site/ethics.html
          echo "PASS ethics page mentions public-API-only"
          grep -q 'Privacy notice' site/privacy.html
          grep -q '30 days' site/privacy.html
          grep -q 'DELETE /v1/analyses' site/privacy.html
          grep -q 'does not sell personal data' site/privacy.html
          echo "PASS privacy notice covers retention and erasure"
          grep -q '/v1/health' site/api-overview.html
          grep -q '/v1/sites' site/api-overview.html
          grep -q 'DELETE' site/api-overview.html
          grep -q '10 / day' site/api-overview.html
          grep -q '200 / day' site/api-overview.html
          grep -q 'public-API-only' site/api-overview.html
          echo "PASS api reference lists health, sites, delete, quotas, ethics"
          grep -q 'lichess' site/supported-sites.html
          grep -q 'chesscom' site/supported-sites.html
          grep -q 'sites.manifest.json' site/supported-sites.html
          grep -q 'GET /v1/sites' site/supported-sites.html
          echo "PASS supported sites lists lichess and chesscom"
          if grep -Eiq 'lorem ipsum|TODO: fill|FIXME|99\.9% uptime|guaranteed detection|placeholders until implementation' site/*.html; then
            echo "FAIL fabricated or placeholder copy found"
            exit 1
          fi
          echo "PASS no banned placeholder/fabricated phrases"
      - name: Secret pattern scan
        run: node scripts/scan-secrets.mjs
