name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs-skeleton:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Pages skeleton files
        run: |
          set -euo pipefail
          required=(
            site/index.html
            site/ethics.html
            site/api-overview.html
            site/supported-sites.html
            site/styles.css
            .github/workflows/pages.yml
          )
          for f in "${required[@]}"; do
            test -f "$f"
            echo "PASS exists: $f"
          done
          grep -q 'public-API-only' site/ethics.html
          echo "PASS ethics page mentions public-API-only"
          grep -q '/v1/health' site/api-overview.html
          echo "PASS api overview lists /v1/health"
          grep -q 'lichess' site/supported-sites.html
          grep -q 'chesscom' site/supported-sites.html
          grep -q 'sites.manifest.json' site/supported-sites.html
          echo "PASS supported sites lists lichess and chesscom"
          if grep -Eiq 'lorem ipsum|TODO: fill|FIXME|99\.9% uptime|guaranteed detection' site/*.html; then
            echo "FAIL fabricated or placeholder copy found"
            exit 1
          fi
          echo "PASS no banned placeholder/fabricated phrases"
