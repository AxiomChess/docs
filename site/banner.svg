      <stop offset="0%" stop-color="#0f1512"/>
      <stop offset="55%" stop-color="#151c19"/>
      <stop offset="100%" stop-color="#0e7a5f"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#e6ede9" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <rect x="0" y="0" width="8" height="420" fill="#3db892"/>

  <g transform="translate(88,118)">
    <rect width="184" height="184" rx="18" fill="#121816" stroke="#2e3a34" stroke-width="2"/>
    <rect x="18" y="18" width="148" height="148" fill="#1c2420"/>
    <g fill="#24302b">
      <rect x="18" y="18" width="37" height="37"/>
      <rect x="92" y="18" width="37" height="37"/>
      <rect x="55" y="55" width="37" height="37"/>
      <rect x="129" y="55" width="37" height="37"/>
      <rect x="18" y="92" width="37" height="37"/>
      <rect x="92" y="92" width="37" height="37"/>
      <rect x="55" y="129" width="37" height="37"/>
      <rect x="129" y="129" width="37" height="37"/>
    </g>
    <circle cx="92" cy="92" r="34" fill="none" stroke="#3db892" stroke-width="6"/>
    <path d="M92 68v48M76 84h32" stroke="#3db892" stroke-width="6" stroke-linecap="square"/>
  </g>

  <text x="320" y="178" fill="#e6ede9" font-family="Syne, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-2.2">AxiomChess</text>
  <text x="320" y="232" fill="#9aaba3" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="28">Calibrated fair-play analysis for finished games</text>
  <rect x="320" y="262" width="148" height="5" fill="#3db892"/>
  <text x="320" y="318" fill="#6f8178" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20">Suspicion bands · uncertainty · methodology · public-API-only</text>
